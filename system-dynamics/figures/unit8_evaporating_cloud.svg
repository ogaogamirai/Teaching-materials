<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="蒸発する雲：対立する2つの行動が、共通の目的Cに合流する">
  <style>
    .goal { fill: #e3f6e5; stroke: #1b6e2e; stroke-width: 2.5; rx: 10; }
    .req { fill: #eef4fb; stroke: #243b53; stroke-width: 2; rx: 8; }
    .act-a { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .act-b { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .edge { stroke: #627d98; stroke-width: 2; fill: none; }
    .conflict { stroke: #b02a2a; stroke-width: 3; fill: none; stroke-dasharray: 6,4; }
    .arrow { fill: #627d98; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 15px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 12px; fill: #52606d; }
    .conflict-text { font-family: "Yu Gothic UI", sans-serif; font-size: 14px; font-weight: bold; fill: #b02a2a; }
  </style>

  <!-- 目的C（上）→ 要求 → 行動（下）の矢印 -->

  <!-- 目的C -->
  <g data-node="goal">
    <rect x="210" y="20" width="300" height="60" class="goal"/>
    <text x="360" y="46" class="label" text-anchor="middle" font-weight="bold">目的C（共通の上位目的）</text>
    <text x="360" y="66" class="label-small" text-anchor="middle">例: チームを強くしたい</text>
  </g>

  <!-- 要求A / 要求B -->
  <g data-node="reqa">
    <rect x="60" y="150" width="200" height="55" class="req"/>
    <text x="160" y="174" class="label" text-anchor="middle" font-weight="bold">要求A</text>
    <text x="160" y="194" class="label-small" text-anchor="middle">規律を守ってほしい</text>
  </g>

  <g data-node="reqb">
    <rect x="460" y="150" width="200" height="55" class="req"/>
    <text x="560" y="174" class="label" text-anchor="middle" font-weight="bold">要求B</text>
    <text x="560" y="194" class="label-small" text-anchor="middle">自分の考えで工夫したい</text>
  </g>

  <!-- 行動A / 行動B -->
  <g data-node="acta">
    <rect x="60" y="290" width="200" height="55" class="act-a"/>
    <text x="160" y="314" class="label" text-anchor="middle" font-weight="bold">行動A</text>
    <text x="160" y="334" class="label-small" text-anchor="middle">先輩の指示に従わせる</text>
  </g>

  <g data-node="actb">
    <rect x="460" y="290" width="200" height="55" class="act-b"/>
    <text x="560" y="314" class="label" text-anchor="middle" font-weight="bold">行動B</text>
    <text x="560" y="334" class="label-small" text-anchor="middle">自分の練習を試す</text>
  </g>

  <!-- 目的C → 要求A / 要求B -->
  <g data-edge="goal->reqa">
    <path class="edge" d="M 290 80 L 180 148"/>
    <polygon class="arrow" points="176,154 188,142 190,154"/>
  </g>
  <g data-edge="goal->reqb">
    <path class="edge" d="M 430 80 L 540 148"/>
    <polygon class="arrow" points="544,154 532,142 530,154"/>
  </g>

  <!-- 要求A → 行動A / 要求B → 行動B -->
  <g data-edge="reqa->acta">
    <path class="edge" d="M 160 205 L 160 288"/>
    <polygon class="arrow" points="160,296 152,284 168,284"/>
  </g>
  <g data-edge="reqb->actb">
    <path class="edge" d="M 560 205 L 560 288"/>
    <polygon class="arrow" points="560,296 552,284 568,284"/>
  </g>

  <!-- 対立（ジグザグ線） -->
  <path d="M 260 317 L 320 302 L 380 332 L 440 317 L 460 317" class="conflict"/>
  <text x="360" y="278" class="conflict-text" text-anchor="middle">対立！</text>

  <!-- 注記 -->
  <text x="360" y="365" class="label-small" text-anchor="middle">実は目的Cは共通。対立の「前提」を外すと、両方かなえられる</text>
</svg>
