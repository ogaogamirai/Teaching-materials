<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">正弦定理の導出：外接円と直径 BD</title>
  <desc id="desc">三角形ABCの外接円に直径BDを引き、円周角の定理からa/sinA=2Rを導く図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 21px; fill: #334155; }
    .side { font-size: 21px; fill: #334155; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="42" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="250" cy="210" r="120" fill="none" stroke="#64748b" stroke-width="3"/>

  <line x1="146.1" y1="270" x2="353.9" y2="270" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="353.9" y1="270" x2="250" y2="90" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <line x1="250" y1="90" x2="146.1" y2="270" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <line x1="146.1" y1="270" x2="353.9" y2="150" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6"/>

  <path d="M 353.9 240 L 337 240 L 337 256" fill="none" stroke="#334155" stroke-width="3"/>

  <circle cx="250" cy="90" r="6" fill="#0ea5e9"/>
  <circle cx="146.1" cy="270" r="6" fill="#ef4444"/>
  <circle cx="353.9" cy="270" r="6" fill="#eab308"/>
  <circle cx="353.9" cy="150" r="6" fill="#64748b"/>

  <text x="244" y="80" class="label">A</text>
  <text x="118" y="290" class="label">B</text>
  <text x="362" y="290" class="label">C</text>
  <text x="358" y="142" class="label">D</text>
  <text x="250" y="292" class="side" fill="#0369a1">a</text>
  <text x="330" y="174" class="side" fill="#b45309">b</text>
  <text x="166" y="174" class="side" fill="#047857">c</text>

  <text x="368" y="240" class="sm" fill="#334155">∠BCD = 90°</text>
  <text x="232" y="140" class="sm" fill="#475569">∠BDC = ∠A</text>
  <text x="28" y="58" class="sm" fill="#64748b"></text>

  <text x="568" y="84" class="heading">正弦定理</text>
  <text x="568" y="122" class="formula">a/sinA = b/sinB = c/sinC</text>
  <text x="568" y="148" class="formula">　＝ 2R（外接円の直径）</text>
  <text x="568" y="174" class="formula">2 角 ＋ 1 辺 → 残り全部</text>
  <line x1="568" y1="192" x2="824" y2="192" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="220" class="note">導出：直径 BD を引く</text>
  <text x="568" y="246" class="note">∠BCD = 90°（円周角の定理）</text>
  <text x="568" y="272" class="note">∠BDC = ∠A（同じ弧）</text>
  <text x="568" y="300" class="formula">→ sinA = a/(2R)</text>
  <text x="568" y="330" class="formula">診断：A=30°・a=5 → R=5</text>
  <text x="568" y="354" class="note">R＝外接円／r＝内接円の使い分け</text>
</svg>
