<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">i の 4 周期（90° 回転）</title>
  <desc id="desc">iを掛けると90°ずつ回り、1→i→−1→−i→1の4周期になることを示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 21px; fill: #334155; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formp { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="110" y1="240" x2="470" y2="240" stroke="#94a3b8" stroke-width="4"/>
  <line x1="290" y1="60" x2="290" y2="420" stroke="#94a3b8" stroke-width="4"/>

  <circle cx="290" cy="240" r="120" fill="none" stroke="#64748b" stroke-width="3"/>

  <circle cx="410" cy="240" r="7" fill="#0ea5e9"/>
  <circle cx="290" cy="120" r="7" fill="#ef4444"/>
  <circle cx="170" cy="240" r="7" fill="#64748b"/>
  <circle cx="290" cy="360" r="7" fill="#eab308"/>

  <text x="422" y="234" class="label" fill="#0369a1">1</text>
  <text x="296" y="106" class="label" fill="#b45309">i</text>
  <text x="146" y="234" class="label" fill="#64748b">−1</text>
  <text x="296" y="382" class="label" fill="#b45309">−i</text>

  <path d="M 398.0 240.0 A 108 108 0 0 0 290.0 132.0" fill="none" stroke="#0ea5e9" stroke-width="3"/>
  <polygon points="290.0,132.0 300.5,127.3 300.5,136.7" fill="#0ea5e9"/>
  <text x="368" y="152" class="sm" fill="#0ea5e9">×i</text>

  <path d="M 290.0 132.0 A 108 108 0 0 0 182.0 240.0" fill="none" stroke="#ef4444" stroke-width="3"/>
  <polygon points="182.0,240.0 177.3,229.5 186.7,229.5" fill="#ef4444"/>
  <text x="208" y="176" class="sm" fill="#ef4444">×i</text>

  <path d="M 182.0 240.0 A 108 108 0 0 0 290.0 348.0" fill="none" stroke="#64748b" stroke-width="3"/>
  <polygon points="290.0,348.0 279.5,352.7 279.5,343.3" fill="#64748b"/>
  <text x="196" y="310" class="sm" fill="#64748b">×i</text>

  <path d="M 290.0 348.0 A 108 108 0 0 0 398.0 240.0" fill="none" stroke="#eab308" stroke-width="3"/>
  <polygon points="398.0,240.0 402.7,250.5 393.3,250.5" fill="#eab308"/>
  <text x="366" y="316" class="sm" fill="#b45309">×i</text>

  <text x="568" y="88" class="heading">複素数と i</text>
  <text x="568" y="128" class="formp">i² ＝ −1　z ＝ a + bi</text>
  <text x="568" y="154" class="formp">共役 z̄ ＝ a − bi（z·z̄ は実数）</text>
  <line x1="568" y1="172" x2="824" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="202" class="note">i を掛ける ＝ 90° 回転</text>
  <text x="568" y="228" class="note">→ 4 周期（i, −1, −i, 1）</text>
  <text x="568" y="260" class="formp">診断：i³ ＝ −i・i⁴ ＝ 1</text>
  <text x="568" y="290" class="note">2 次方程式はすべて解ける</text>
  <text x="568" y="318" class="note">複素数平面・オイラーへ続く</text>
</svg>
