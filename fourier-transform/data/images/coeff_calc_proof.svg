<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">フーリエ係数 aₙ, bₙ 決定公式の完全導出</text>

  <!-- Step 1: Multiply cos(mx) and Integrate -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="580" height="150" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="30" fill="#22d3ee" font-size="15" font-weight="bold">【ステップ1】両辺に cos(mx) を掛けて 0〜2π で積分する</text>
    
    <text x="25" y="60" fill="#cbd5e1" font-size="13">∫₀²π f(x) cos(mx) dx</text>
    <text x="25" y="85" fill="#cbd5e1" font-size="13">＝ a₁ ∫₀²π cos x cos mx dx ＋ ... ＋ aₘ ∫₀²π cos²(mx) dx ＋ b₁ ∫₀²π sin x cos mx dx ...</text>

    <text x="25" y="125" fill="#f43f5e" font-size="13" font-weight="bold">直交性より m ≠ n の項はすべて 0 になって消滅！</text>
  </g>

  <!-- Step 2: Only m = n remains -->
  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="275" height="225" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="137" y="30" fill="#fbbf24" font-size="15" font-weight="bold" text-anchor="middle">【ステップ2】aₘ の項だけが残る！</text>

    <text x="15" y="65" fill="#cbd5e1" font-size="12">∫₀²π f(x) cos(mx) dx</text>
    <text x="15" y="95" fill="#a7f3d0" font-size="13" font-weight="bold">＝ aₘ × ∫₀²π cos²(mx) dx</text>

    <text x="15" y="130" fill="#cbd5e1" font-size="12">前ノードで証明した通り：</text>
    <text x="25" y="155" fill="#38bdf8" font-size="13" font-weight="bold">∫₀²π cos²(mx) dx ＝ π</text>

    <text x="15" y="195" fill="#f8fafc" font-size="13" font-weight="bold">➔ 右辺 ＝ aₘ × π</text>
  </g>

  <!-- Step 3: Divide by pi -->
  <g transform="translate(325, 220)">
    <rect x="0" y="0" width="275" height="225" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#e11d48" stroke-width="1.5"/>
    <text x="137" y="30" fill="#fda4af" font-size="15" font-weight="bold" text-anchor="middle">【ステップ3】両辺を π で割って公式完成</text>

    <text x="15" y="70" fill="#cbd5e1" font-size="13">両辺を π で割ると：</text>
    
    <rect x="15" y="95" width="245" height="50" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="1"/>
    <text x="137" y="127" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">aₙ ＝ (1/π) ∫₀²π f(x) cos(nx) dx</text>

    <rect x="15" y="155" width="245" height="50" fill="#0f172a" rx="6" stroke="#fb7185" stroke-width="1"/>
    <text x="137" y="187" fill="#fb7185" font-size="14" font-weight="bold" text-anchor="middle">bₙ ＝ (1/π) ∫₀²π f(x) sin(nx) dx</text>
  </g>
</svg>
