<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="蒸発する雲：対立する2つの行動が、共通の目的Cに合流する">
  <style>
    .goal { fill: #e3f6e5; stroke: #1b6e2e; stroke-width: 2.5; rx: 10; }
    .req { fill: #eef4fb; stroke: #243b53; stroke-width: 2; rx: 8; }
    .act-a { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .act-b { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .edge { stroke: #627d98; stroke-width: 2; fill: none; }
    .conflict { stroke: #b02a2a; stroke-width: 3; fill: none; stroke-dasharray: 6,4; }
    .arrow { fill: #627d98; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 15px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 12px; fill: #52606d; }
    .conflict-text { font-family: "Yu Gothic UI", sans-serif; font-size: 14px; font-weight: bold; fill: #b02a2a; }
  </style>

  <!-- 目的C -->
  <rect x="210" y="20" width="300" height="60" class="goal"/>
  <text x="360" y="46" class="label" text-anchor="middle" font-weight="bold">目的C（共通の上位目的）</text>
  <text x="360" y="66" class="label-small" text-anchor="middle">例: チームを強くしたい</text>

  <!-- 要求A / 要求B -->
  <rect x="60" y="140" width="200" height="55" class="req"/>
  <text x="160" y="164" class="label" text-anchor="middle" font-weight="bold">要求A</text>
  <text x="160" y="184" class="label-small" text-anchor="middle">規律を守ってほしい</text>

  <rect x="460" y="140" width="200" height="55" class="req"/>
  <text x="560" y="164" class="label" text-anchor="middle" font-weight="bold">要求B</text>
  <text x="560" y="184" class="label-small" text-anchor="middle">自分の考えで工夫したい</text>

  <!-- 目的C → 要求 -->
  <path d="M 290 80 L 180 138" class="edge"/>
  <polygon points="178,140 188,128 190,140" class="arrow"/>
  <path d="M 430 80 L 540 138" class="edge"/>
  <polygon points="542,140 532,128 530,140" class="arrow"/>

  <!-- 行動A / 行動B -->
  <rect x="60" y="270" width="200" height="55" class="act-a"/>
  <text x="160" y="294" class="label" text-anchor="middle" font-weight="bold">行動A</text>
  <text x="160" y="314" class="label-small" text-anchor="middle">先輩の指示に従わせる</text>

  <rect x="460" y="270" width="200" height="55" class="act-b"/>
  <text x="560" y="294" class="label" text-anchor="middle" font-weight="bold">行動B</text>
  <text x="560" y="314" class="label-small" text-anchor="middle">自分の練習を試す</text>

  <!-- 要求 → 行動 -->
  <path d="M 160 195 L 160 268" class="edge"/>
  <polygon points="160,270 154,260 166,260" class="arrow"/>
  <path d="M 560 195 L 560 268" class="edge"/>
  <polygon points="560,270 554,260 566,260" class="arrow"/>

  <!-- 対立（ジグザグ線） -->
  <path d="M 260 297 L 320 282 L 380 312 L 440 297 L 460 297" class="conflict"/>
  <text x="360" y="258" class="conflict-text" text-anchor="middle">対立！</text>

  <!-- 注記 -->
  <text x="360" y="345" class="label-small" text-anchor="middle">実は目的Cは共通。対立の「前提」を外すと、両方かなえられる</text>
</svg>
