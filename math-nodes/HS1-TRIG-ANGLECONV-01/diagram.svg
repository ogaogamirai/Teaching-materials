<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">余角・補角の変換公式：単位円の 2 つの対称性</title>
  <desc id="desc">30°・150°（補角）が y 軸対象、30°・60°（余角）が y=x 対象であることを示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 20px; }
    .sm { font-size: 17px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="96" y1="210" x2="404" y2="210" stroke="#94a3b8" stroke-width="3"/>
  <line x1="250" y1="62" x2="250" y2="358" stroke="#94a3b8" stroke-width="3"/>
  <line x1="150.4" y1="309.6" x2="349.6" y2="110.4" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 6"/>

  <circle cx="250" cy="210" r="140" fill="none" stroke="#64748b" stroke-width="3"/>

  <line x1="250" y1="210" x2="371.2" y2="140" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="210" x2="128.8" y2="140" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="210" x2="320" y2="88.8" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <line x1="128.8" y1="140" x2="371.2" y2="140" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="320" y1="88.8" x2="371.2" y2="140" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="371.2" cy="140" r="7" fill="#0ea5e9"/>
  <circle cx="128.8" cy="140" r="7" fill="#ef4444"/>
  <circle cx="320" cy="88.8" r="7" fill="#eab308"/>

  <text x="386" y="134" class="label" fill="#0369a1">A（30°）</text>
  <text x="60" y="134" class="label" fill="#b45309">B（150°）</text>
  <text x="330" y="80" class="label" fill="#b45309">C（60°）</text>
  <text x="238" y="232" class="sm">O</text>
  <text x="88" y="204" class="sm" fill="#64748b">x</text>
  <text x="262" y="66" class="sm" fill="#64748b">y</text>
  <text x="398" y="104" class="sm" fill="#94a3b8">y = x</text>
  <text x="262" y="342" class="sm" fill="#94a3b8">y 軸対称</text>

  <text x="568" y="88" class="heading">変換公式</text>
  <text x="568" y="128" class="formula">sin(90°−θ) = cosθ</text>
  <text x="568" y="154" class="formula">cos(90°−θ) = sinθ</text>
  <text x="568" y="186" class="formula">sin(180°−θ) = sinθ</text>
  <text x="568" y="212" class="formula">cos(180°−θ) = −cosθ</text>
  <text x="568" y="238" class="formula">tan(180°−θ) = −tanθ</text>
  <line x1="568" y1="258" x2="824" y2="258" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="286" class="note">対称軸：y=x（余角）・y軸（補角）</text>
  <text x="568" y="312" class="note">例：sin150° = sin30° = 1/2</text>
  <text x="568" y="338" class="note">　cos150° = −cos30° = −√3/2</text>
</svg>
