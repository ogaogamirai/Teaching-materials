<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">一般角：正回転・負回転・2π の周期を単位円で見る</title>
  <desc id="desc">π/3 の点と−π/3の点、そして2πを加えた同じ終線の考え方を示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 20px; }
    .sm { font-size: 17px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="96" y1="210" x2="404" y2="210" stroke="#94a3b8" stroke-width="3"/>
  <line x1="250" y1="62" x2="250" y2="358" stroke="#94a3b8" stroke-width="3"/>

  <circle cx="250" cy="210" r="140" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- 回転の向き：円周の外側（r=148）にずらして重なりを回避 -->
  <path d="M 398 210 A 148 148 0 0 0 324 82" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="9 6" opacity="0.9"/>
  <path d="M 398 210 A 148 148 0 0 1 324 338" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="9 6" opacity="0.95"/>

  <line x1="250" y1="210" x2="320" y2="88.8" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="210" x2="320" y2="331.2" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 5"/>

  <path d="M 270 210 A 20 20 0 0 0 260 192.7" fill="none" stroke="#b45309" stroke-width="4"/>
  <polygon points="259,187 269,193 258,199" fill="#b45309"/>
  <path d="M 270 210 A 20 20 0 0 1 260 227.3" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <polygon points="259,233 269,227 258,221" fill="#94a3b8"/>

  <circle cx="320" cy="88.8" r="7" fill="#0ea5e9"/>
  <circle cx="320" cy="331.2" r="7" fill="#eab308"/>

  <text x="280" y="196" class="sm" fill="#b45309">+π/3</text>
  <text x="280" y="266" class="sm" fill="#64748b">−π/3</text>
  <text x="330" y="84" class="label" fill="#0369a1">P（θ = π/3）</text>
  <text x="330" y="346" class="label" fill="#b45309">P′（θ = −π/3）</text>
  <text x="238" y="232" class="sm">O</text>
  <text x="88" y="204" class="sm" fill="#64748b">始線</text>
  <text x="392" y="396" class="sm" fill="#94a3b8"></text>

  <text x="568" y="88" class="heading">一般角の 3 つの規則</text>
  <text x="568" y="126" class="formula">①正は反時計回り（ラジアン）</text>
  <text x="568" y="152" class="formula">②θ と θ + 2π は同じ終線</text>
  <line x1="568" y1="172" x2="824" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="202" class="note">cos(−θ) = cosθ（偶関数）</text>
  <text x="568" y="228" class="note">sin(−θ) = −sinθ（奇関数）</text>
  <text x="568" y="258" class="note">周期 2π：2πn を引いて</text>
  <text x="568" y="282" class="note">から値を読むのが基本手順</text>
  <text x="568" y="314" class="formula">診断：cos(−π/3) = 1/2</text>
  <text x="568" y="340" class="note">★P′は P の y 座標だけ反転した点</text>
</svg>
