<svg xmlns="http://www.w3.org/2000/svg" width="660" height="380" viewBox="0 0 660 380" role="img" aria-label="正のループ（増えるともっと増える）と負のループ（増えると抑える）">
  <style>
    .node-green { fill: #e3f6e5; stroke: #1b6e2e; stroke-width: 2; rx: 8; }
    .node-orange { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .node-mid { fill: #eef4fb; stroke: #243b53; stroke-width: 2; rx: 8; }
    .edge { stroke: #243b53; stroke-width: 2.5; fill: none; }
    .edge-green { stroke: #1b6e2e; stroke-width: 2.5; fill: none; }
    .edge-orange { stroke: #a05a1c; stroke-width: 2.5; fill: none; }
    .arrow { fill: #243b53; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 15px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 12px; fill: #52606d; }
    .title { font-family: "Yu Gothic UI", sans-serif; font-size: 16px; font-weight: bold; fill: #243b53; }
    .plus { font-family: "Yu Gothic UI", sans-serif; font-size: 22px; font-weight: bold; fill: #1b6e2e; }
    .minus { font-family: "Yu Gothic UI", sans-serif; font-size: 22px; font-weight: bold; fill: #a05a1c; }
  </style>

  <!-- ===== 正のループ（左） ===== -->
  <text x="165" y="30" class="title" text-anchor="middle">正のループ（増えるともっと増える）</text>

  <!-- ノード -->
  <g data-node="followers">
    <rect x="105" y="60" width="120" height="45" class="node-green"/>
    <text x="165" y="86" class="label" text-anchor="middle" font-weight="bold">フォロワー</text>
  </g>

  <g data-node="viewers">
    <rect x="105" y="230" width="120" height="45" class="node-mid"/>
    <text x="165" y="256" class="label" text-anchor="middle">見る人が増える</text>
  </g>

  <g data-node="grow">
    <rect x="105" y="310" width="120" height="40" class="node-mid"/>
    <text x="165" y="334" class="label" text-anchor="middle">さらに増える</text>
  </g>

  <!-- エッジ（時計回り） -->
  <g data-edge="followers->viewers">
    <path class="edge-green" d="M 165 105 L 165 228"/>
    <polygon class="arrow" points="165,238 156,224 174,224"/>
  </g>
  <g data-edge="viewers->grow">
    <path class="edge-green" d="M 165 275 L 165 308"/>
    <polygon class="arrow" points="165,316 156,304 174,304"/>
  </g>
  <g data-edge="grow->followers">
    <path class="edge-green" d="M 110 310 C 40 300, 40 110, 115 88"/>
    <polygon class="arrow" points="122,84 108,96 100,84"/>
  </g>

  <text x="65" y="205" class="plus">＋</text>
  <text x="60" y="295" class="plus">＋</text>
  <text x="235" y="180" class="label-small">増えると、さらに増える（雪だるま）</text>

  <!-- ===== 負のループ（右） ===== -->
  <text x="495" y="30" class="title" text-anchor="middle">負のループ（増えると抑える）</text>

  <g data-node="temp">
    <rect x="435" y="60" width="120" height="45" class="node-orange"/>
    <text x="495" y="86" class="label" text-anchor="middle" font-weight="bold">室温</text>
  </g>

  <g data-node="hot">
    <rect x="435" y="230" width="120" height="45" class="node-mid"/>
    <text x="495" y="256" class="label" text-anchor="middle">暑いと感じる</text>
  </g>

  <g data-node="ac">
    <rect x="435" y="310" width="120" height="40" class="node-mid"/>
    <text x="495" y="334" class="label" text-anchor="middle">エアコンを下げる</text>
  </g>

  <g data-edge="temp->hot">
    <path class="edge-orange" d="M 495 105 L 495 228"/>
    <polygon class="arrow" points="495,238 486,224 504,224"/>
  </g>
  <g data-edge="hot->ac">
    <path class="edge-orange" d="M 495 275 L 495 308"/>
    <polygon class="arrow" points="495,316 486,304 504,304"/>
  </g>
  <g data-edge="ac->temp">
    <path class="edge-orange" d="M 440 310 C 370 300, 370 110, 445 88"/>
    <polygon class="arrow" points="452,84 438,96 430,84"/>
  </g>

  <text x="395" y="205" class="minus">−</text>
  <text x="390" y="295" class="minus">−</text>
  <text x="565" y="180" class="label-small">増えると、抑える方向（バランス）</text>
</svg>
