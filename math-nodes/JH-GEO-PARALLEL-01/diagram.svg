<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">平行線の同位角・錯角・対頂角</title>
  <desc id="desc">平行2直線を横断線が切るときの角の対応（同位角・錯角・対頂角）を示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .num { font-size: 13px; font-weight: 700; }
    .tag { font-size: 16px; fill: #334155; }
    .sm { font-size: 15px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formp { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="60" y1="130" x2="470" y2="130" stroke="#64748b" stroke-width="4"/>
  <line x1="60" y1="280" x2="470" y2="280" stroke="#64748b" stroke-width="4"/>
  <line x1="140" y1="60" x2="430" y2="350" stroke="#f59e0b" stroke-width="3"/>

  <circle cx="210" cy="130" r="6" fill="#334155"/>
  <circle cx="360" cy="280" r="6" fill="#334155"/>

  <path d="M 191.6 111.6 A 26 26 0 0 1 236.0 130.0" fill="none" stroke="#0ea5e9" stroke-width="4"/>
  <path d="M 236.0 130.0 A 26 26 0 0 1 228.4 148.4" fill="none" stroke="#ef4444" stroke-width="4"/>
  <path d="M 228.4 148.4 A 26 26 0 0 1 184.0 130.0" fill="none" stroke="#10b981" stroke-width="4"/>
  <path d="M 184.0 130.0 A 26 26 0 0 1 191.6 111.6" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <path d="M 341.6 261.6 A 26 26 0 0 1 386.0 280.0" fill="none" stroke="#0ea5e9" stroke-width="4"/>
  <path d="M 386.0 280.0 A 26 26 0 0 1 378.4 298.4" fill="none" stroke="#ef4444" stroke-width="4"/>
  <path d="M 378.4 298.4 A 26 26 0 0 1 334.0 280.0" fill="none" stroke="#10b981" stroke-width="4"/>
  <path d="M 334.0 280.0 A 26 26 0 0 1 341.6 261.6" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <text x="225" y="99" class="num" fill="#0ea5e9" text-anchor="middle">1</text>
  <text x="245" y="149" class="num" fill="#ef4444" text-anchor="middle">2</text>
  <text x="195" y="169" class="num" fill="#10b981" text-anchor="middle">3</text>
  <text x="175" y="119" class="num" fill="#f59e0b" text-anchor="middle">4</text>

  <text x="375" y="249" class="num" fill="#0ea5e9" text-anchor="middle">5</text>
  <text x="395" y="299" class="num" fill="#ef4444" text-anchor="middle">6</text>
  <text x="345" y="319" class="num" fill="#10b981" text-anchor="middle">7</text>
  <text x="325" y="269" class="num" fill="#f59e0b" text-anchor="middle">8</text>

  <text x="60" y="122" class="sm" fill="#64748b">ℓ</text>
  <text x="60" y="272" class="sm" fill="#64748b">m（ℓ ∥ m）</text>
  <text x="252" y="330" class="tag" fill="#0ea5e9">同位角：1 ＝ 5</text>
  <text x="252" y="358" class="tag" fill="#10b981">錯角：3 ＝ 5（ジグザグ内側）</text>
  <text x="252" y="386" class="tag" fill="#ef4444">対頂角：1 ＝ 3</text>

  <text x="568" y="88" class="heading">平行線と角</text>
  <text x="568" y="128" class="formp">ℓ ∥ m ⇒ 同位角・錯角が等しい</text>
  <text x="568" y="154" class="formp">対頂角は常に等しい</text>
  <line x1="568" y1="172" x2="824" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="202" class="note">三角形の内角の和 ＝ 180°</text>
  <text x="568" y="228" class="note">　（頂点から補助平行線 1 本）</text>
  <text x="568" y="260" class="formp">診断：90°＋30°＋?＝180°</text>
  <text x="568" y="286" class="formp">→ 残り 60°</text>
  <text x="568" y="318" class="note">三角定規の 30・60・90 もこれから</text>
</svg>
