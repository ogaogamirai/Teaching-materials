<svg xmlns="http://www.w3.org/2000/svg" width="660" height="300" viewBox="0 0 660 300" role="img" aria-label="お風呂の水位：蛇口（入り）と排水口（出）">
  <style>
    .pipe { stroke: #243b53; stroke-width: 3; fill: none; }
    .arrow { fill: #243b53; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 16px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 13px; fill: #52606d; }
    .water { fill: #9cc3e5; }
    .tank { fill: none; stroke: #243b53; stroke-width: 3; }
  </style>

  <!-- 蛇口（入り）：上から浴槽へ流れ込む＝下向き矢印 -->
  <g data-node="tap">
    <rect x="30" y="30" width="120" height="30" rx="6" fill="none" stroke="none"/>
    <text x="90" y="50" class="label" text-anchor="middle" font-weight="bold">蛇口（入り）</text>
  </g>
  <g data-edge="tap->tank">
    <path class="pipe" d="M 90 60 L 90 105"/>
    <polygon class="arrow" points="90,122 82,106 98,106"/>
  </g>

  <!-- 浴槽 -->
  <g data-node="tank">
    <rect x="30" y="110" width="220" height="130" rx="10" class="tank"/>
  </g>
  <rect x="45" y="130" width="190" height="95" rx="4" class="water"/>
  <text x="140" y="185" class="label" text-anchor="middle" font-weight="bold">お風呂の水位</text>
  <text x="140" y="210" class="label-small" text-anchor="middle">（ストック：たまるもの）</text>

  <!-- 排水口（出）：浴槽から右へ出ていく＝右向き矢印 -->
  <g data-edge="tank->drain">
    <path class="pipe" d="M 250 229 L 290 229"/>
    <polygon class="arrow" points="300,229 286,221 286,237"/>
  </g>
  <g data-node="drain">
    <rect x="310" y="218" width="80" height="22" rx="6" fill="#eef4fb" stroke="#243b53" stroke-width="2"/>
  </g>
  <text x="350" y="233" class="label" text-anchor="middle" font-weight="bold">排水口（出）</text>

  <!-- ルール -->
  <text x="140" y="288" class="label-small" text-anchor="middle">水位の変化 ＝ 入り − 出（入りが多ければ上がる・出が多ければ下がる）</text>
</svg>
