<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 12px;">
  <style>
    .t { font-family: "Cambria Math", "Segoe UI Symbol", "Segoe UI", system-ui, sans-serif; }
    .jp { font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  </style>

  <text class="jp" x="340" y="32" fill="#38bdf8" font-size="17" font-weight="bold" text-anchor="middle">実数形と複素形 — 総和の範囲と係数の対応</text>

  <!-- Left -->
  <g transform="translate(16, 48)">
    <rect x="0" y="0" width="312" height="410" fill="rgba(30,41,59,0.75)" rx="10" stroke="#06b6d4" stroke-width="1.5"/>
    <text class="jp" x="156" y="28" fill="#06b6d4" font-size="15" font-weight="bold" text-anchor="middle">① 実数フーリエ級数</text>

    <rect x="12" y="44" width="288" height="100" fill="#0f172a" rx="6" stroke="#06b6d4"/>
    <text class="jp" x="20" y="66" fill="#cbd5e1" font-size="11">展開式（n は 1,2,3,… のみ）</text>
    <text class="t" x="20" y="92" fill="#fff" font-size="13" font-weight="bold">f(x) = a₀/2 + Σₙ₌₁^∞ (aₙ cos nx + bₙ sin nx)</text>
    <text class="jp" x="20" y="122" fill="#a7f3d0" font-size="11">各 n に係数が aₙ と bₙ の 2 つ</text>

    <rect x="12" y="158" width="288" height="232" fill="#0f172a" rx="6" stroke="#334155"/>
    <text class="jp" x="20" y="186" fill="#fbbf24" font-size="13" font-weight="bold">要点</text>
    <text class="jp" x="20" y="216" fill="#fff" font-size="12">・部品：cos と sin（2種類）</text>
    <text class="jp" x="20" y="244" fill="#fff" font-size="12">・周波数：正の整数 n=1,2,3,…</text>
    <text class="jp" x="20" y="272" fill="#fff" font-size="12">・係数：aₙ（偶）と bₙ（奇）</text>
    <text class="jp" x="20" y="300" fill="#fff" font-size="12">・直感：振幅が読みやすい</text>
    <text class="jp" x="20" y="340" fill="#f43f5e" font-size="12" font-weight="bold">→ 積和・微積の計算が長くなりやすい</text>
  </g>

  <!-- Right -->
  <g transform="translate(352, 48)">
    <rect x="0" y="0" width="312" height="410" fill="rgba(30,41,59,0.75)" rx="10" stroke="#fb7185" stroke-width="1.5"/>
    <text class="jp" x="156" y="28" fill="#fb7185" font-size="15" font-weight="bold" text-anchor="middle">② 複素フーリエ級数</text>

    <rect x="12" y="44" width="288" height="100" fill="#0f172a" rx="6" stroke="#fb7185"/>
    <text class="jp" x="20" y="66" fill="#cbd5e1" font-size="11">展開式（n は …-2,-1,0,1,2…）</text>
    <text class="t" x="20" y="90" fill="#fff" font-size="13" font-weight="bold">f(x) = Σ (n=−∞ … +∞) cₙ e^{i n x}</text>
    <text class="jp" x="20" y="122" fill="#a7f3d0" font-size="11">和の範囲は −∞ から +∞（上端は +∞）</text>

    <rect x="12" y="158" width="288" height="232" fill="#0f172a" rx="6" stroke="#334155"/>
    <text class="jp" x="20" y="186" fill="#fbbf24" font-size="13" font-weight="bold">係数の対応（n≥1）</text>
    <text class="t" x="20" y="216" fill="#fff" font-size="13">c₀ = a₀/2</text>
    <text class="t" x="20" y="244" fill="#fff" font-size="13">cₙ = (aₙ − i bₙ)/2</text>
    <text class="t" x="20" y="272" fill="#fff" font-size="13">c₋ₙ = (aₙ + i bₙ)/2</text>
    <text class="jp" x="20" y="304" fill="#cbd5e1" font-size="12">※ aₙ・bₙ の情報は cₙ と c₋ₙ のペア</text>
    <text class="t" x="20" y="340" fill="#a7f3d0" font-size="12" font-weight="bold">d/dx e^{i n x} = i·n·e^{i n x}</text>
  </g>
</svg>
