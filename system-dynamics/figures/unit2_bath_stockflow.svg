<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="お風呂の水位：蛇口（入り）と排水口（出）">
  <style>
    .box { fill: #eef4fb; stroke: #243b53; stroke-width: 2; }
    .pipe { stroke: #243b53; stroke-width: 3; fill: none; }
    .arrow { fill: #243b53; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 16px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 13px; fill: #52606d; }
    .water { fill: #9cc3e5; }
    .tank { fill: none; stroke: #243b53; stroke-width: 3; }
  </style>

  <!-- 蛇口（入り） -->
  <text x="90" y="50" class="label" text-anchor="middle" font-weight="bold">蛇口（入り）</text>
  <path d="M 90 60 L 90 95" class="pipe"/>
  <polygon points="90,108 84,96 96,96" class="arrow"/>

  <!-- 浴槽 -->
  <rect x="30" y="110" width="220" height="130" rx="10" class="tank"/>
  <rect x="45" y="130" width="190" height="95" rx="4" class="water"/>
  <text x="140" y="185" class="label" text-anchor="middle" font-weight="bold">お風呂の水位</text>
  <text x="140" y="210" class="label-small" text-anchor="middle">（ストック：たまるもの）</text>

  <!-- 排水口（出） -->
  <rect x="255" y="225" width="50" height="8" class="box"/>
  <path d="M 255 229 L 220 229" class="pipe"/>
  <polygon points="208,229 220,223 220,235" class="arrow"/>
  <text x="330" y="245" class="label" text-anchor="middle" font-weight="bold">排水口（出）</text>

  <!-- ルール -->
  <text x="140" y="280" class="label-small" text-anchor="middle">水位の変化 ＝ 入り − 出</text>
</svg>
