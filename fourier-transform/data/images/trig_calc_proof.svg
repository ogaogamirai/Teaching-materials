<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="300" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">三角関数の微積分の王道証明</text>

  <!-- Left Box: (sin x)' = cos x -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="270" height="340" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="135" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">① (sin x)' = cos x の証明</text>

    <text x="15" y="65" fill="#cbd5e1" font-size="13">微分の定義：</text>
    <text x="25" y="90" fill="#f8fafc" font-size="13" font-weight="bold">lim<sub>h→0</sub> [sin(x+h) - sin x] / h</text>

    <text x="15" y="125" fill="#cbd5e1" font-size="13">加法定理で sin(x+h) を開く：</text>
    <text x="25" y="150" fill="#fbbf24" font-size="12">sin x cos h + cos x sin h - sin x</text>

    <text x="15" y="185" fill="#cbd5e1" font-size="13">式を整理して極限を適用：</text>
    <text x="25" y="210" fill="#a7f3d0" font-size="12">= sin x · <tspan fill="#f43f5e">[(cos h - 1)/h]</tspan> + cos x · <tspan fill="#38bdf8">[sin h / h]</tspan></text>

    <text x="15" y="245" fill="#cbd5e1" font-size="12">※ h→0 のとき <tspan fill="#f43f5e">前者は 0</tspan>, <tspan fill="#38bdf8">後者は 1</tspan> ！</text>

    <rect x="15" y="270" width="240" height="50" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="1"/>
    <text x="135" y="302" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">結論: (sin x)' = cos x</text>
  </g>

  <!-- Right Box: Integral of sin(ax) -->
  <g transform="translate(310, 55)">
    <rect x="0" y="0" width="270" height="340" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#e11d48" stroke-width="1.5"/>
    <text x="135" y="30" fill="#fda4af" font-size="16" font-weight="bold" text-anchor="middle">② ∫ sin(ax) dx の証明</text>

    <text x="15" y="65" fill="#cbd5e1" font-size="13">微分の逆演算（原始関数）：</text>
    <text x="25" y="90" fill="#f8fafc" font-size="13" font-weight="bold">「微分して sin(ax) になるもの」を探す</text>

    <text x="15" y="130" fill="#cbd5e1" font-size="13">cos(ax) を微分してみる：</text>
    <text x="25" y="155" fill="#fbbf24" font-size="13">(cos(ax))' = - a sin(ax)</text>

    <text x="15" y="195" fill="#cbd5e1" font-size="13">両辺を -a で割ると：</text>
    <text x="25" y="220" fill="#a7f3d0" font-size="13">(- 1/a cos(ax))' = sin(ax)</text>

    <rect x="15" y="270" width="240" height="50" fill="#0f172a" rx="6" stroke="#fb7185" stroke-width="1"/>
    <text x="135" y="300" fill="#fb7185" font-size="14" font-weight="bold" text-anchor="middle">結論: ∫ sin(ax)dx = - (1/a)cos(ax)</text>
  </g>
</svg>
