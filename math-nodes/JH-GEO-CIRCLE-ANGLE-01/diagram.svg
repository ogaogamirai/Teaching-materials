<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title desc">
  <title id="title">円周角の定理：同じ弧から見る 2 つの角度</title>
  <desc id="desc">中心角60°の弧ABを、円周上の2点PとP'から見ると、どちらも円周角30°になることを示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 20px; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="820" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="252" height="312" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="250" cy="210" r="130" fill="none" stroke="#64748b" stroke-width="3"/>

  <line x1="250" y1="210" x2="362.6" y2="145" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="210" x2="362.6" y2="275" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <line x1="362.6" y1="145" x2="362.6" y2="275" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

  <path d="M 276 210 A 30 30 0 0 0 276 195" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M 276 210 A 30 30 0 0 1 276 225" fill="none" stroke="#334155" stroke-width="3"/>

  <line x1="250" y1="210" x2="137.4" y2="145" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 5"/>
  <line x1="137.4" y1="145" x2="362.6" y2="145" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="137.4" y1="145" x2="362.6" y2="275" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 5"/>
  <line x1="250" y1="210" x2="205.5" y2="332.1" stroke="#94a3b8" stroke-width="4" stroke-dasharray="7 5"/>

  <circle cx="362.6" cy="145" r="6" fill="#0ea5e9"/>
  <circle cx="362.6" cy="275" r="6" fill="#eab308"/>
  <circle cx="137.4" cy="145" r="7" fill="#ef4444"/>
  <circle cx="205.5" cy="332.1" r="7" fill="#10b981"/>

  <text x="368" y="128" class="label">A</text>
  <text x="368" y="296" class="label">B</text>
  <text x="96" y="140" class="label">P</text>
  <text x="164" y="352" class="label">P′</text>
  <text x="232" y="196" class="sm" fill="#b45309">O</text>
  <text x="290" y="240" class="sm">∠AOB = 60°</text>
  <text x="60" y="170" class="sm" fill="#b45309">∠APB = 30°</text>
  <text x="200" y="370" class="sm" fill="#047857">∠AP′B = 30°</text>

  <text x="568" y="88" class="heading">円周角の定理</text>
  <text x="568" y="128" class="formula">円周角 ＝ 中心角の 1/2</text>
  <text x="568" y="154" class="formula">同じ弧 → 円周角は等しい</text>
  <text x="568" y="186" class="formula">直径 → 円周角 90°</text>
  <line x1="568" y1="206" x2="772" y2="206" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="236" class="note">半径を引くと二等辺三角形</text>
  <text x="568" y="262" class="note">外角の定理で 2 倍の関係</text>
  <text x="568" y="292" class="formula">診断：直径 → 90°</text>
  <text x="568" y="322" class="note">外接円・正弦定理の土台</text>
</svg>
