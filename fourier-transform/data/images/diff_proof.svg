<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">微分の基礎：平均の速さから「瞬間の傾き f'(x)」へ</text>

  <!-- Left: Secant Slope to Tangent Slope (h -> 0) -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="285" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>
    <text x="142" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">① 割線の傾きから接線の傾きへ</text>

    <!-- Axes -->
    <line x1="30" y1="330" x2="265" y2="330" stroke="#64748b" stroke-width="1.5"/>
    <line x1="40" y1="50" x2="40" y2="340" stroke="#64748b" stroke-width="1.5"/>

    <!-- Curve y = f(x) -->
    <path d="M 40 310 Q 140 280 250 80" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="235" y="70" fill="#38bdf8" font-size="13" font-weight="bold">y = f(x)</text>

    <!-- Point A (x, f(x)) -->
    <circle cx="110" cy="250" r="5" fill="#fbbf24"/>
    <line x1="110" y1="250" x2="110" y2="330" stroke="#fbbf24" stroke-dasharray="3,3"/>
    <text x="105" y="350" fill="#fbbf24" font-size="13" font-weight="bold">x</text>

    <!-- Point B (x+h, f(x+h)) -->
    <circle cx="190" cy="160" r="5" fill="#f43f5e"/>
    <line x1="190" y1="160" x2="190" y2="330" stroke="#f43f5e" stroke-dasharray="3,3"/>
    <text x="175" y="350" fill="#f43f5e" font-size="13" font-weight="bold">x + h</text>

    <!-- Secant Line -->
    <line x1="70" y1="295" x2="230" y2="115" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Tangent Line at A -->
    <line x1="50" y1="310" x2="200" y2="160" stroke="#a7f3d0" stroke-width="2.5"/>
    <text x="180" y="200" fill="#a7f3d0" font-size="12" font-weight="bold">接線 (h ➔ 0)</text>

    <!-- Formula overlay -->
    <rect x="15" y="40" width="255" height="60" fill="#0f172a" rx="6" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="65" fill="#fbbf24" font-size="13" font-weight="bold">割線の傾き (平均の速さ):</text>
    <text x="25" y="85" fill="#ffffff" font-size="13" font-weight="bold">[f(x+h) − f(x)] / h</text>
  </g>

  <!-- Right: Limit Formula & Concrete Example (x^2 -> 2x) -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="280" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="140" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">② 導関数の定義と具体例</text>

    <!-- Definition Box -->
    <rect x="15" y="50" width="250" height="130" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#38bdf8" font-size="14" font-weight="bold">微分の定義式 f'(x)</text>
    <text x="25" y="105" fill="#ffffff" font-size="14" font-weight="bold">f'(x) ＝ lim [f(x+h)−f(x)] / h</text>
    <text x="125" y="125" fill="#cbd5e1" font-size="11">h ➔ 0</text>
    <text x="25" y="155" fill="#a7f3d0" font-size="12" font-weight="bold">『幅 h を無限に 0 に縮めた瞬間の傾き』！</text>

    <!-- Example Box: f(x) = x^2 -->
    <rect x="15" y="195" width="250" height="175" fill="#0f172a" rx="8" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="220" fill="#fbbf24" font-size="14" font-weight="bold">具体例：f(x) ＝ x² の微分</text>
    <text x="25" y="245" fill="#ffffff" font-size="12">f(x+h) ＝ (x+h)² ＝ x² ＋ 2xh ＋ h²</text>
    <text x="25" y="270" fill="#ffffff" font-size="12">分子 ＝ f(x+h) − f(x) ＝ 2xh ＋ h²</text>
    <text x="25" y="295" fill="#ffffff" font-size="12">h で割る ➔ (2xh ＋ h²) / h ＝ 2x ＋ h</text>
    <text x="25" y="320" fill="#fbbf24" font-size="13" font-weight="bold">h ➔ 0 にすると ➔ f'(x) ＝ 2x ！</text>
    <text x="25" y="348" fill="#a7f3d0" font-size="12">手計算で (x²)' ＝ 2x が見事に完全証明！</text>
  </g>
</svg>
