<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">ネイピア数 e の定義・微積分とオイラーの公式への意義</text>

  <!-- Left: Limit (1 + 1/n)^n -> e -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="285" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>
    <text x="142" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">① 連続複利と e の極限定義</text>

    <!-- Table of (1 + 1/n)^n -->
    <rect x="15" y="50" width="255" height="150" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#38bdf8" font-size="13" font-weight="bold">分割数 n ➔ (1 ＋ 1/n)ⁿ の値</text>
    <text x="25" y="100" fill="#ffffff" font-size="12">n ＝ 1 (1年一括) ➔ (1＋1)¹ ＝ 2.0</text>
    <text x="25" y="120" fill="#ffffff" font-size="12">n ＝ 2 (半年ごと) ➔ (1＋1/2)² ＝ 2.25</text>
    <text x="25" y="140" fill="#ffffff" font-size="12">n ＝ 12 (毎月) ➔ (1＋1/12)¹² ≒ 2.613</text>
    <text x="25" y="160" fill="#ffffff" font-size="12">n ＝ 365 (毎日) ➔ (1＋1/365)³⁶⁵ ≒ 2.714</text>
    <text x="25" y="185" fill="#fbbf24" font-size="13" font-weight="bold">n ➔ ∞ (無限分割) ➔ e ≒ 2.71828...</text>

    <!-- Formula Box -->
    <rect x="15" y="215" width="255" height="155" fill="#0f172a" rx="8" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="240" fill="#fbbf24" font-size="14" font-weight="bold">極限によるネイピア数の定義</text>
    <text x="25" y="275" fill="#ffffff" font-size="15" font-weight="bold">lim (1 ＋ 1/n)ⁿ ＝ e</text>
    <text x="25" y="295" fill="#cbd5e1" font-size="11">n ➔ ∞</text>
    <text x="25" y="325" fill="#a7f3d0" font-size="12" font-weight="bold">『自然界の連続成長の限界限界値』！</text>
    <text x="25" y="350" fill="#cbd5e1" font-size="11">e ≒ 2.71828 18284 59045...</text>
  </g>

  <!-- Right: Calculus Property (e^x)' = e^x & Euler Meaning -->
  <g transform="translate(320, 50)">
    <rect x="0" y="0" width="280" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="140" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">② 微積分の奇跡と意義</text>

    <!-- Derivative Box -->
    <rect x="15" y="50" width="250" height="135" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#38bdf8" font-size="14" font-weight="bold">(e^x)' ＝ e^x  （微分の奇跡）</text>
    <text x="25" y="105" fill="#ffffff" font-size="13" font-weight="bold">微分しても形が変わらない唯一の関数！</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="12">x ＝ 0 での接線の傾きがピッタリ 1</text>
    <text x="25" y="155" fill="#a7f3d0" font-size="12" font-weight="bold">積分：∫ e^x dx ＝ e^x ＋ C</text>

    <!-- Euler Meaning Box -->
    <rect x="15" y="200" width="250" height="170" fill="#0f172a" rx="8" stroke="#f43f5e" stroke-width="1"/>
    <text x="25" y="225" fill="#f43f5e" font-size="14" font-weight="bold">③ オイラーの公式理解への意義</text>
    <text x="25" y="255" fill="#ffffff" font-size="13" font-weight="bold">(e^{iθ})' ＝ i · e^{iθ}</text>
    <text x="25" y="285" fill="#fbbf24" font-size="12">・i を掛ける ➔ 『90° 反時計回り回転』</text>
    <text x="25" y="310" fill="#cbd5e1" font-size="12">・(e^x)'＝e^x の性質があるからこそ、</text>
    <text x="25" y="330" fill="#cbd5e1" font-size="12">　速度が常に進行方向と直角を向き、</text>
    <text x="25" y="350" fill="#a7f3d0" font-size="12" font-weight="bold">　完璧な円運動 e^{iθ} ＝ cosθ ＋ i sinθ に！</text>
  </g>
</svg>
