<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="CRT現状問題ツリー：散らばった5つの症状が1つの根本原因に収束する">
  <style>
    .ude { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .cause { fill: #eef4fb; stroke: #243b53; stroke-width: 2; rx: 8; }
    .root { fill: #fde2e2; stroke: #b02a2a; stroke-width: 3; rx: 8; }
    .edge { stroke: #627d98; stroke-width: 2; fill: none; }
    .arrow { fill: #627d98; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 12px; fill: #52606d; }
    .tag { font-family: "Yu Gothic UI", sans-serif; font-size: 11px; fill: #52606d; }
  </style>

  <!-- UDE 行（上部・散らばった症状） -->
  <rect x="20" y="20" width="130" height="42" class="ude"/>
  <text x="85" y="37" class="label" text-anchor="middle">朝、起きられない</text>
  <text x="85" y="54" class="tag" text-anchor="middle">UDE1</text>

  <rect x="180" y="20" width="130" height="42" class="ude"/>
  <text x="245" y="37" class="label" text-anchor="middle">朝ごはんを食べない</text>
  <text x="245" y="54" class="tag" text-anchor="middle">UDE2</text>

  <rect x="340" y="20" width="130" height="42" class="ude"/>
  <text x="405" y="37" class="label" text-anchor="middle">授業中に眠くなる</text>
  <text x="405" y="54" class="tag" text-anchor="middle">UDE3</text>

  <rect x="500" y="20" width="120" height="42" class="ude"/>
  <text x="560" y="37" class="label" text-anchor="middle">成績が下がる</text>
  <text x="560" y="54" class="tag" text-anchor="middle">UDE4</text>

  <rect x="640" y="20" width="110" height="42" class="ude"/>
  <text x="695" y="37" class="label" text-anchor="middle">友達と衝突する</text>
  <text x="695" y="54" class="tag" text-anchor="middle">UDE5</text>

  <!-- Cause 中間行 -->
  <rect x="95" y="130" width="150" height="40" class="cause"/>
  <text x="170" y="155" class="label" text-anchor="middle">エネルギー不足</text>

  <rect x="365" y="130" width="140" height="40" class="cause"/>
  <text x="435" y="155" class="label" text-anchor="middle">集中力が続かない</text>

  <!-- エッジ：UDE → Cause -->
  <path d="M 85 62 L 150 128" class="edge"/>
  <polygon points="152,132 138,122 156,124" class="arrow"/>
  <path d="M 245 62 L 195 128" class="edge"/>
  <polygon points="193,132 203,118 205,128" class="arrow"/>
  <path d="M 405 62 L 420 128" class="edge"/>
  <polygon points="422,132 412,122 428,124" class="arrow"/>
  <path d="M 560 62 L 465 128" class="edge"/>
  <polygon points="463,132 471,118 473,128" class="arrow"/>

  <!-- 合流点：睡眠不足 -->
  <rect x="260" y="230" width="170" height="50" class="cause"/>
  <text x="345" y="253" class="label" text-anchor="middle" font-weight="bold">睡眠不足</text>
  <text x="345" y="271" class="tag" text-anchor="middle">共通の原因（合流）</text>

  <!-- エッジ：Cause → 睡眠不足 -->
  <path d="M 170 170 L 310 228" class="edge"/>
  <polygon points="313,230 300,222 307,236" class="arrow"/>
  <path d="M 435 170 L 375 228" class="edge"/>
  <polygon points="373,230 382,218 383,228" class="arrow"/>

  <!-- Root -->
  <rect x="280" y="320" width="210" height="60" class="root"/>
  <text x="385" y="346" class="label" text-anchor="middle" font-weight="bold">夜更かし（スマホ）</text>
  <text x="385" y="367" class="tag" text-anchor="middle">Root（根本原因）</text>

  <!-- エッジ：睡眠不足 → Root -->
  <path d="M 345 280 L 375 318" class="edge"/>
  <polygon points="377,320 366,312 373,326" class="arrow"/>

  <!-- 注記 -->
  <text x="385" y="405" class="label-small" text-anchor="middle">見た目はバラバラの5症状 → 因果を辿ると1つの Root に収束</text>
</svg>
