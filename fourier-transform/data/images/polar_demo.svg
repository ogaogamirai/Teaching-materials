<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">極形式とド・モアブルの定理の完全図解</text>

  <!-- Left: De Moivre Theorem Visual -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="290" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>
    <text x="145" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">① ド・モアブルの定理の図解</text>

    <!-- Axes -->
    <line x1="30" y1="200" x2="260" y2="200" stroke="#64748b" stroke-width="1.5"/>
    <line x1="145" y1="50" x2="145" y2="350" stroke="#64748b" stroke-width="1.5"/>

    <!-- Unit Circle -->
    <circle cx="145" cy="200" r="100" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>

    <!-- Point z (angle θ) -->
    <line x1="145" y1="200" x2="215" y2="130" stroke="#06b6d4" stroke-width="2"/>
    <circle cx="215" cy="130" r="4" fill="#06b6d4"/>
    <text x="225" y="130" fill="#06b6d4" font-size="13" font-weight="bold">z (角度 θ)</text>

    <!-- Point z^2 (angle 2θ) -->
    <line x1="145" y1="200" x2="145" y2="100" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="145" cy="100" r="4" fill="#a7f3d0"/>
    <text x="155" y="105" fill="#a7f3d0" font-size="13" font-weight="bold">z² (角度 2θ)</text>

    <!-- Point z^3 (angle 3θ) -->
    <line x1="145" y1="200" x2="75" y2="130" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="75" cy="130" r="4" fill="#f43f5e"/>
    <text x="15" y="130" fill="#f43f5e" font-size="13" font-weight="bold">z³ (角度 3θ)</text>

    <!-- Formula Box -->
    <rect x="15" y="270" width="260" height="100" fill="#0f172a" rx="6" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="295" fill="#fbbf24" font-size="14" font-weight="bold">n 乗すると角度は n 倍！</text>
    <text x="25" y="325" fill="#ffffff" font-size="13" font-weight="bold">(cosθ ＋ i sinθ)ⁿ ＝</text>
    <text x="35" y="350" fill="#38bdf8" font-size="13" font-weight="bold">cos(nθ) ＋ i sin(nθ)</text>
  </g>

  <!-- Right: Conjugate & Powers -->
  <g transform="translate(325, 50)">
    <rect x="0" y="0" width="275" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="137" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">共役複素数と絶対値の2乗</text>

    <!-- Conjugate Box -->
    <rect x="15" y="50" width="245" height="150" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#38bdf8" font-size="14" font-weight="bold">② 共役（きょうやく）複素数 z̄</text>
    <text x="25" y="105" fill="#ffffff" font-size="14" font-weight="bold">z ＝ a ＋ bi  ➔  z̄ ＝ a − bi</text>
    <text x="25" y="130" fill="#cbd5e1" font-size="12">上下線対称の反転（角度 −θ）。</text>
    <text x="25" y="160" fill="#a7f3d0" font-size="13" font-weight="bold">z · z̄ ＝ a² ＋ b² ＝ |z|² （長さの2乗！）</text>

    <!-- Connection to Euler Box -->
    <rect x="15" y="215" width="245" height="155" fill="#0f172a" rx="8" stroke="#f43f5e" stroke-width="1"/>
    <text x="25" y="240" fill="#f43f5e" font-size="14" font-weight="bold">③ オイラーの公式への架け橋</text>
    <text x="25" y="270" fill="#ffffff" font-size="13">e^{iθ} ＝ cosθ ＋ i sinθ</text>
    <text x="25" y="295" fill="#fbbf24" font-size="13">e^{i nθ} ＝ (e^{iθ})ⁿ ＝ cos(nθ)＋i sin(nθ)</text>
    <text x="25" y="325" fill="#cbd5e1" font-size="12">指数法則とド・モアブルが完全一致！</text>
  </g>
</svg>
