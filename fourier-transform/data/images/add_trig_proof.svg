<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">三角関数の加法定理の幾何学的図解証明</text>

  <!-- Left: Geometry Diagram -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="300" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>

    <!-- Base Axis -->
    <line x1="30" y1="340" x2="270" y2="340" stroke="#64748b" stroke-width="1.5"/>
    <text x="275" y="345" fill="#94a3b8" font-size="12">x</text>

    <!-- Angle alpha Triangle (Bottom) -->
    <polygon points="40,340 220,340 220,230" fill="rgba(6, 182, 212, 0.1)" stroke="#06b6d4" stroke-width="1.5"/>
    <!-- Angle alpha arc -->
    <path d="M 70 340 A 30 30 0 0 0 65 324" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="75" y="333" fill="#fbbf24" font-size="14" font-weight="bold">α</text>

    <!-- Angle beta Triangle (Stacked on top) -->
    <!-- Hypotenuse = 1 from (40,340) to P(130, 80) -->
    <line x1="40" y1="340" x2="130" y2="80" stroke="#f8fafc" stroke-width="2.5"/>
    <text x="75" y="200" fill="#f8fafc" font-size="13" font-weight="bold" transform="rotate(-70 80 200)">斜辺 = 1</text>

    <!-- Angle beta arc -->
    <path d="M 65 324 A 30 30 0 0 0 53 302" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="56" y="310" fill="#f43f5e" font-size="14" font-weight="bold">β</text>

    <!-- Point P and perpendiculars -->
    <circle cx="130" cy="80" r="5" fill="#38bdf8"/>
    <text x="130" y="65" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">点 P (α+β)</text>

    <!-- Vertical Total Height sin(α+β) -->
    <line x1="130" y1="80" x2="130" y2="340" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="4,4"/>
    <text x="138" y="210" fill="#fb7185" font-size="14" font-weight="bold">sin(α+β)</text>

    <!-- Breakdown Components -->
    <!-- sin α cos β (Bottom part) -->
    <line x1="220" y1="340" x2="220" y2="230" stroke="#06b6d4" stroke-width="3"/>
    <text x="225" y="290" fill="#22d3ee" font-size="12" font-weight="bold">sinα cosβ</text>

    <!-- cos α sin β (Top part) -->
    <line x1="130" y1="80" x2="220" y2="130" stroke="#a7f3d0" stroke-width="2"/>
    <line x1="220" y1="230" x2="220" y2="130" stroke="#a7f3d0" stroke-width="3"/>
    <text x="225" y="180" fill="#a7f3d0" font-size="12" font-weight="bold">cosα sinβ</text>

    <!-- Caption -->
    <text x="150" y="375" fill="#cbd5e1" font-size="12" text-anchor="middle">高さ ＝ sinα cosβ ＋ cosα sinβ</text>
  </g>

  <!-- Right: Formulas & Explanation -->
  <g transform="translate(335, 50)">
    <rect x="0" y="0" width="265" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="132" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">加法定理の2大公式</text>

    <!-- sin(α+β) Box -->
    <rect x="15" y="50" width="235" height="140" fill="#0f172a" rx="8" stroke="#fb7185" stroke-width="1"/>
    <text x="25" y="75" fill="#fb7185" font-size="14" font-weight="bold">【サインの加法定理】</text>
    <text x="25" y="105" fill="#ffffff" font-size="13" font-weight="bold">sin(α+β) ＝</text>
    <text x="35" y="130" fill="#22d3ee" font-size="13" font-weight="bold">sinα cosβ <tspan fill="#ffffff">＋</tspan> cosα sinβ</text>
    <text x="25" y="165" fill="#94a3b8" font-size="12">語録: 咲いたコスモス＋コスモス咲いた</text>

    <!-- cos(α+β) Box -->
    <rect x="15" y="210" width="235" height="160" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="235" fill="#38bdf8" font-size="14" font-weight="bold">【コサインの加法定理】</text>
    <text x="25" y="265" fill="#ffffff" font-size="13" font-weight="bold">cos(α+β) ＝</text>
    <text x="35" y="290" fill="#a7f3d0" font-size="13" font-weight="bold">cosα cosβ <tspan fill="#f43f5e">−</tspan> sinα sinβ</text>
    <text x="25" y="325" fill="#94a3b8" font-size="12">語録: コスモスコスモス − 咲いた咲いた</text>
    <text x="25" y="352" fill="#fbbf24" font-size="12">※ 横の長さは引き算になるのがポイント！</text>
  </g>
</svg>
