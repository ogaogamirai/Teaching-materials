<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">3-4-5 の直角三角形で基本相互関係を確かめる</title>
  <desc id="desc">sinとcosとtanの値が、3-4-5の三角形でどの関係を満たすかを示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .side { font-size: 22px; fill: #334155; }
    .angle { font-size: 22px; fill: #334155; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="540" y="46" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="140" y1="300" x2="260" y2="300" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="260" y1="300" x2="260" y2="180" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="300" x2="260" y2="180" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>

  <path d="M 244 300 L 244 284 L 260 284" fill="none" stroke="#334155" stroke-width="4"/>
  <path d="M 158 300 A 18 18 0 0 0 155.4 287" fill="none" stroke="#334155" stroke-width="4"/>

  <text x="118" y="246" class="side">o = 3</text>
  <text x="188" y="336" class="side">a = 4</text>
  <text x="200" y="236" class="side">h = 5</text>
  <text x="148" y="290" class="angle">θ</text>

  <text x="168" y="128" class="heading" fill="#334155" style="font-size:20px;">3-4-5の三角形</text>

  <text x="560" y="90" class="heading">3-4-5 で確かめる</text>
  <text x="560" y="126" class="formula">sinθ = 3/5 、 cosθ = 4/5</text>
  <text x="560" y="152" class="formula">sin²θ = 9/25 、 cos²θ = 16/25</text>
  <text x="560" y="178" class="formula">9/25 + 16/25 = 1</text>
  <text x="560" y="210" class="formula">tanθ = (3/5)÷(4/5) = 3/4</text>
  <line x1="560" y1="228" x2="824" y2="228" stroke="#e2e8f0" stroke-width="2"/>
  <text x="560" y="256" class="note">3 本はすべてここから出る</text>
  <text x="560" y="280" class="note">①三平方を h² で割る → 1 本目</text>
  <text x="560" y="304" class="note">②sin を cos で割る → 2 本目</text>
  <text x="560" y="328" class="note">③1 を cos² で割る → 3 本目</text>
  <text x="560" y="346" class="note">覚えなくても導けるのが強み</text>
</svg>
