  <text x="568" y="88" class="heading">マクローリン展開</text>
  <text x="568" y="126" class="formp">f(x) ＝ Σ f^(n)(0)/n!・xⁿ</text>
  <text x="568" y="152" class="formp">係数 ＝ f^(n)(0)/n!</text>
  <line x1="568" y1="170" x2="772" y2="170" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="200" class="note">xⁿ を n 回微分 → n!</text>
  <text x="568" y="226" class="note">e^x・sin・cos の美しい級数</text>
  <text x="568" y="258" class="formp">診断：すべての階で 1 → 1/n!</text>
  <text x="568" y="288" class="note">sin 0.1 ≈ 0.0998（級数近似）</text>
  <text x="568" y="318" class="note">→ オイラーの公式へ</text>
