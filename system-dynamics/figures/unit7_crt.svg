<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="CRT現状問題ツリー：散らばった5つの症状が1つの根本原因に収束する">
  <style>
    .ude { fill: #fdeee2; stroke: #a05a1c; stroke-width: 2; rx: 8; }
    .cause { fill: #eef4fb; stroke: #243b53; stroke-width: 2; rx: 8; }
    .root { fill: #fde2e2; stroke: #b02a2a; stroke-width: 3; rx: 8; }
    .edge { stroke: #627d98; stroke-width: 2; fill: none; }
    .arrow { fill: #627d98; }
    .label { font-family: "Yu Gothic UI", sans-serif; font-size: 14px; fill: #1f2933; }
    .label-small { font-family: "Yu Gothic UI", sans-serif; font-size: 12px; fill: #52606d; }
    .tag { font-family: "Yu Gothic UI", sans-serif; font-size: 11px; fill: #52606d; }
  </style>

  <!-- ===== ノード宣言（data-node） =====
       CRT の矢印は「原因 → 結果」=「下 → 上」。
       Root（下）→ 睡眠不足（中）→ UDE（上）の順に上向き。
  -->

  <!-- UDE 行（上部・症状） -->
  <rect data-node="ude1" x="20" y="330" width="130" height="42" class="ude"/>
  <text x="85" y="347" class="label" text-anchor="middle">朝、起きられない</text>
  <text x="85" y="364" class="tag" text-anchor="middle">UDE1</text>

  <rect data-node="ude2" x="180" y="330" width="130" height="42" class="ude"/>
  <text x="245" y="347" class="label" text-anchor="middle">朝ごはんを食べない</text>
  <text x="245" y="364" class="tag" text-anchor="middle">UDE2</text>

  <rect data-node="ude3" x="340" y="330" width="130" height="42" class="ude"/>
  <text x="405" y="347" class="label" text-anchor="middle">授業中に眠くなる</text>
  <text x="405" y="364" class="tag" text-anchor="middle">UDE3</text>

  <rect data-node="ude4" x="500" y="330" width="120" height="42" class="ude"/>
  <text x="560" y="347" class="label" text-anchor="middle">成績が下がる</text>
  <text x="560" y="364" class="tag" text-anchor="middle">UDE4</text>

  <rect data-node="ude5" x="640" y="330" width="110" height="42" class="ude"/>
  <text x="695" y="347" class="label" text-anchor="middle">友達と衝突する</text>
  <text x="695" y="364" class="tag" text-anchor="middle">UDE5</text>

  <!-- Cause 中間行（中段） -->
  <rect data-node="cause1" x="95" y="180" width="150" height="40" class="cause"/>
  <text x="170" y="205" class="label" text-anchor="middle">エネルギー不足</text>

  <rect data-node="cause2" x="365" y="180" width="140" height="40" class="cause"/>
  <text x="435" y="205" class="label" text-anchor="middle">集中力が続かない</text>

  <!-- 合流点：睡眠不足 -->
  <rect data-node="sleep" x="260" y="60" width="170" height="50" class="cause"/>
  <text x="345" y="83" class="label" text-anchor="middle" font-weight="bold">睡眠不足</text>
  <text x="345" y="101" class="tag" text-anchor="middle">共通の原因（合流）</text>

  <!-- Root（最下段） -->
  <rect data-node="root" x="280" y="340" width="210" height="60" class="root"/>
  <text x="385" y="366" class="label" text-anchor="middle" font-weight="bold">夜更かし（スマホ）</text>
  <text x="385" y="387" class="tag" text-anchor="middle">Root（根本原因）</text>

  <!-- ===== エッジ宣言（<g data-edge="from->to">）＝ 原因 → 結果 =====
       Root → 睡眠不足 → UDE/Cause。矢印は上向き（原因から結果へ）。
  -->

  <!-- Root → 睡眠不足 -->
  <g data-edge="root->sleep">
    <path class="edge" d="M 345 340 L 335 112"/>
    <polygon class="arrow" points="332,102 342,118 322,116"/>
  </g>

  <!-- 睡眠不足 → エネルギー不足 -->
  <g data-edge="sleep->cause1">
    <path class="edge" d="M 300 60 L 185 178"/>
    <polygon class="arrow" points="180,186 194,174 190,190"/>
  </g>

  <!-- 睡眠不足 → 集中力不足 -->
  <g data-edge="sleep->cause2">
    <path class="edge" d="M 390 60 L 425 178"/>
    <polygon class="arrow" points="428,186 418,174 434,190"/>
  </g>

  <!-- エネルギー不足 → 朝起きられない / 朝ごはん -->
  <g data-edge="cause1->ude1">
    <path class="edge" d="M 150 220 L 100 328"/>
    <polygon class="arrow" points="97,338 107,320 107,332"/>
  </g>
  <g data-edge="cause1->ude2">
    <path class="edge" d="M 190 220 L 235 328"/>
    <polygon class="arrow" points="238,338 228,320 228,332"/>
  </g>

  <!-- 集中力不足 → 授業中に眠くなる / 成績が下がる -->
  <g data-edge="cause2->ude3">
    <path class="edge" d="M 405 220 L 405 328"/>
    <polygon class="arrow" points="405,338 399,320 411,320"/>
  </g>
  <g data-edge="cause2->ude4">
    <path class="edge" d="M 455 220 L 550 328"/>
    <polygon class="arrow" points="553,338 543,320 543,332"/>
  </g>

  <!-- 睡眠不足 → 友達と衝突（簡略：睡眠不足→UDE5 に直結表示） -->
  <g data-edge="sleep->ude5">
    <path class="edge" d="M 420 60 L 680 328"/>
    <polygon class="arrow" points="683,338 673,320 673,332"/>
  </g>

  <!-- 注記 -->
  <text x="385" y="415" class="label-small" text-anchor="middle">矢印は「原因 → 結果」＝下から上。散らばった5症状が1つの Root に収束する</text>
</svg>
