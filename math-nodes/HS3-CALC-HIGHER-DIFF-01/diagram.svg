<!-- layout v5 2026-08-30: cyclic clockwise sin→cos→−sin→−cos→sin -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">sin の高階微分サイクル（4 周期）</title>
  <desc id="desc">sin→cos→−sin→−cos→sin の4段階の微分サイクルを時計回りに示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
    .head { font-size: 18px; font-weight: 700; fill: #334155; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .arrow { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formp { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 上段：sin → cos -->
  <rect x="60" y="60" width="150" height="70" rx="12" class="box"/>
  <text x="84" y="92" class="head" fill="#0ea5e9">sin x</text>
  <text x="84" y="114" class="sub">スタート</text>

  <line x1="212" y1="95" x2="276" y2="95" class="arrow"/>
  <polygon points="280,95 268,89 268,101" fill="#94a3b8"/>
  <text x="222" y="84" class="sub">① 微分</text>

  <rect x="280" y="60" width="150" height="70" rx="12" class="box"/>
  <text x="304" y="92" class="head" fill="#10b981">cos x</text>
  <text x="304" y="114" class="sub">1 階＝傾き（+90°）</text>

  <!-- 右辺：cos ↓ −sin -->
  <line x1="355" y1="132" x2="355" y2="196" class="arrow"/>
  <polygon points="355,200 349,188 361,188" fill="#94a3b8"/>
  <text x="368" y="168" class="sub">② 微分</text>

  <!-- 下段右：−sin -->
  <rect x="280" y="200" width="150" height="70" rx="12" class="box"/>
  <text x="304" y="232" class="head" fill="#64748b">−sin x</text>
  <text x="304" y="254" class="sub">2 階＝反りの逆転</text>

  <!-- 下辺：−sin ← −cos -->
  <line x1="276" y1="235" x2="214" y2="235" class="arrow"/>
  <polygon points="210,235 222,229 222,241" fill="#94a3b8"/>
  <text x="228" y="224" class="sub">③ 微分</text>

  <!-- 下段左：−cos（sin の真下） -->
  <rect x="60" y="200" width="150" height="70" rx="12" class="box"/>
  <text x="84" y="232" class="head" fill="#b45309">−cos x</text>
  <text x="84" y="254" class="sub">3 階</text>

  <!-- 左辺：−cos ↑ sin（4 階で一周） -->
  <line x1="135" y1="198" x2="135" y2="134" class="arrow"/>
  <polygon points="135,130 129,142 141,142" fill="#94a3b8"/>
  <text x="52" y="168" class="sub">④ sin に戻る</text>

  <rect x="60" y="300" width="370" height="44" rx="10" class="box"/>
  <text x="84" y="328" class="head" style="font-size:16px;">(sin x)^(n)：n を 4 で割った余りで判定</text>

  <text x="568" y="88" class="heading">高階導関数</text>
  <text x="568" y="128" class="formp">f''(x)＝加速</text>
  <text x="568" y="150" class="formp">f''''(x)＝sin に戻る</text>
  <text x="568" y="176" class="formp">e^x は何回微分しても e^x</text>
  <line x1="568" y1="194" x2="824" y2="194" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="224" class="note">多項式は階数分で 0 に（x⁴の5階=0）</text>
  <text x="568" y="250" class="note">ライプニッツ：積の n 階微分</text>
  <text x="568" y="276" class="note">　(fg)''＝f''g+2f'g'+fg''</text>
  <text x="568" y="310" class="formp">診断：4 階で sin x に戻る</text>
  <text x="568" y="336" class="note">→ テイラー展開の係数</text>
  <text x="568" y="358" class="note">　（n!/f^(n)(0)）</text>
</svg>
