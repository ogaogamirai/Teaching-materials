<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="320" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">マクローリン展開の幾何学的イメージと驚異的有用性</text>

  <!-- Left: Geometric Image of High-Order Contact -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="290" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="145" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">① グラフが吸い付く「高次接触」</text>

    <!-- Axes -->
    <line x1="30" y1="330" x2="270" y2="330" stroke="#64748b" stroke-width="1.5"/>
    <line x1="145" y1="50" x2="145" y2="340" stroke="#64748b" stroke-width="1.5"/>

    <!-- Original Curve y = sin x -->
    <path d="M 40 230 C 90 100 200 360 260 230" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <text x="210" y="180" fill="#38bdf8" font-size="13" font-weight="bold">y = sin x</text>

    <!-- 1st approx: y = x (Tangent line) -->
    <line x1="45" y1="330" x2="245" y2="130" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="175" y="130" fill="#a7f3d0" font-size="11">1次近似: y = x</text>

    <!-- 3rd approx: y = x - x^3/6 (Cubic) -->
    <path d="M 50 310 Q 145 230 250 170" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="170" y="270" fill="#fbbf24" font-size="11">3次近似: y = x − x³/6</text>

    <!-- Center Point (0, 0) -->
    <circle cx="145" cy="230" r="5" fill="#f43f5e"/>
    <text x="155" y="240" fill="#f43f5e" font-size="12" font-weight="bold">(0, 0)</text>

    <!-- Explanation Box -->
    <rect x="12" y="295" width="266" height="80" fill="#0f172a" rx="6" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="318" fill="#fbbf24" font-size="13" font-weight="bold">【高次接触のイメージ】</text>
    <text x="20" y="340" fill="#ffffff" font-size="12">0次:高さ ➔ 1次:傾き ➔ 2次:曲がり具合 ➔</text>
    <text x="20" y="362" fill="#a7f3d0" font-size="12" font-weight="bold">次数を上げるほどグラフがピタッと重なる！</text>
  </g>

  <!-- Right: Practical Use (sin 0.1 = 0.0998333...) -->
  <g transform="translate(330, 50)">
    <rect x="0" y="0" width="290" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="145" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">② 電卓の正体！驚異の有用性</text>

    <!-- Example Box: sin 0.1 -->
    <rect x="12" y="50" width="266" height="150" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="73" fill="#38bdf8" font-size="14" font-weight="bold">具体例：sin 0.1 を手計算してみる！</text>
    <text x="20" y="98" fill="#ffffff" font-size="12">sin x ≒ x − x³/6  (マクローリン展開)</text>
    <text x="20" y="123" fill="#ffffff" font-size="12">x ＝ 0.1 を代入 ➔ 0.1 − (0.1)³/6</text>
    <text x="20" y="148" fill="#ffffff" font-size="13" font-weight="bold">＝ 0.1 − 0.0001667 ＝ 0.0998333...</text>
    <text x="20" y="178" fill="#a7f3d0" font-size="12" font-weight="bold">電卓の値 0.0998334... と完璧に一致！</text>

    <!-- Utility Box -->
    <rect x="12" y="215" width="266" height="160" fill="#0f172a" rx="6" stroke="#f43f5e" stroke-width="1"/>
    <text x="20" y="240" fill="#f43f5e" font-size="14" font-weight="bold">【なぜマクローリン展開が凄いのか？】</text>
    <text x="20" y="265" fill="#ffffff" font-size="12">1. 手計算不可能な sin, cos, eˣ を</text>
    <text x="20" y="285" fill="#ffffff" font-size="12">　『四則演算（足し算・掛け算）』だけで出せる！</text>
    <text x="20" y="310" fill="#ffffff" font-size="12">2. パソコンや電卓の内部処理のアルゴリズム！</text>
    <text x="20" y="335" fill="#ffffff" font-size="12">3. 物理で使う小角近似 sin x ≒ x の理由！</text>
    <text x="20" y="360" fill="#fbbf24" font-size="11" font-weight="bold">➔ 人類最高の数学ツールの一つ！</text>
  </g>
</svg>
