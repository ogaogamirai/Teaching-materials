<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#fbbf24" font-size="20" font-weight="bold" text-anchor="middle">積和公式の導出と直交性微積分の完全証明</text>

  <!-- Step 1: Product to Sum derivation -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="580" height="150" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="30" fill="#38bdf8" font-size="16" font-weight="bold">【ステップ1】加法定理の引き算から『積和公式』を導出する</text>
    
    <text x="25" y="60" fill="#cbd5e1" font-size="13">① cos(A - B) = cos A cos B + sin A sin B</text>
    <text x="25" y="85" fill="#cbd5e1" font-size="13">② cos(A + B) = cos A cos B - sin A sin B</text>

    <line x1="20" y1="95" x2="300" y2="95" stroke="#64748b" stroke-width="1"/>
    <text x="315" y="90" fill="#f43f5e" font-size="13" font-weight="bold">① − ② を計算（引き算）</text>

    <text x="25" y="125" fill="#fbbf24" font-size="15" font-weight="bold">➔  sin A sin B ＝ 1/2 [ cos(A - B) − cos(A + B) ]  （積和公式の完成！）</text>
  </g>

  <!-- Step 2: m != n case (0) -->
  <g transform="translate(20, 220)">
    <rect x="0" y="0" width="275" height="225" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="137" y="30" fill="#22d3ee" font-size="15" font-weight="bold" text-anchor="middle">【ステップ2】m ≠ n の直交性証明</text>

    <text x="15" y="60" fill="#cbd5e1" font-size="12">∫₀²π sin(mx)sin(nx) dx</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12">＝ 1/2 ∫₀²π [cos(m-n)x - cos(m+n)x] dx</text>

    <text x="15" y="120" fill="#a7f3d0" font-size="12">＝ 1/2 [ <tspan fill="#38bdf8">sin(m-n)x / (m-n)</tspan> − <tspan fill="#38bdf8">sin(m+n)x / (m+n)</tspan> ]₀²π</text>

    <text x="15" y="155" fill="#cbd5e1" font-size="12">※ sin(k · 2π) ＝ 0, sin(0) ＝ 0 より</text>

    <rect x="15" y="170" width="245" height="42" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="1"/>
    <text x="137" y="197" fill="#38bdf8" font-size="16" font-weight="bold" text-anchor="middle">結果: 0 − 0 ＝ 0 （直交！）</text>
  </g>

  <!-- Step 3: m = n case (pi) -->
  <g transform="translate(325, 220)">
    <rect x="0" y="0" width="275" height="225" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#e11d48" stroke-width="1.5"/>
    <text x="137" y="30" fill="#fda4af" font-size="15" font-weight="bold" text-anchor="middle">【ステップ3】m ＝ n の成分抽出証明</text>

    <text x="15" y="60" fill="#cbd5e1" font-size="12">∫₀²π sin²(mx) dx</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="12">＝ ∫₀²π (1 - cos 2mx) / 2 dx （半角公式）</text>

    <text x="15" y="120" fill="#a7f3d0" font-size="12">＝ 1/2 [x]₀²π − 1/2 [sin(2mx) / 2m]₀²π</text>

    <text x="15" y="155" fill="#cbd5e1" font-size="12">＝ 1/2 (2π - 0) − 0</text>

    <rect x="15" y="170" width="245" height="42" fill="#0f172a" rx="6" stroke="#fb7185" stroke-width="1"/>
    <text x="137" y="197" fill="#fb7185" font-size="16" font-weight="bold" text-anchor="middle">結果: π （成分が炙り出される！）</text>
  </g>
</svg>
