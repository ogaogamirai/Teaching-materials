  <text x="486" y="294" class="tick">θ</text>
  <text x="78" y="216" class="tick">1</text>
  <text x="78" y="356" class="tick">−1</text>
  <text x="78" y="286" class="tick">0</text>
  <text x="174" y="300" class="tick" text-anchor="end">π/2</text>
  <text x="270" y="300" class="tick" text-anchor="end">π</text>
  <text x="366" y="300" class="tick" text-anchor="end">3π/2</text>
  <text x="462" y="300" class="tick" text-anchor="end">2π</text>

  <text x="330" y="186" class="label" fill="#0369a1">y = sin θ</text>
  <text x="366" y="100" class="label" fill="#b45309">y = sin 2θ</text>

  <text x="580" y="90" class="heading">波の 3 つの支配者</text>
  <text x="580" y="130" class="formula">振幅 A ＝ 縦の高さ</text>
  <text x="580" y="160" class="formula">周期 2π/k ＝ 横の詰まり</text>
  <text x="580" y="190" class="formula">位相 α/k ＝ 右へのずれ</text>
  <line x1="580" y1="210" x2="824" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  <text x="580" y="242" class="note">y = A sin(kθ − α)</text>
  <text x="580" y="274" class="note">sin 2θ は sin θ の</text>
  <text x="580" y="296" class="note">波を横半分に詰めたもの</text>
  <text x="580" y="324" class="note">→ 周期は π（2π の半分）</text>
  <text x="580" y="352" class="note">縦の高さ（振幅）は 1 のまま</text>
</svg>

