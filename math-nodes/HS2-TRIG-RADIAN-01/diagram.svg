<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">1 ラジアンの定義：半径と同じ長さの弧</title>
  <desc id="desc">半径の長さと同じ長さの弧を持つ角が1ラジアンであることを示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 20px; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formula { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <circle cx="250" cy="210" r="140" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="250" cy="210" r="90" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="250" y1="210" x2="390" y2="210" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
  <line x1="92" y1="210" x2="250" y2="210" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="9 6"/>

  <path d="M 390 210 A 140 140 0 0 0 325.7 92.2" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <line x1="250" y1="210" x2="325.7" y2="92.2" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <path d="M 270 210 A 20 20 0 0 0 260.8 197" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M 310 210 A 60 60 0 0 0 280.7 165" fill="none" stroke="#94a3b8" stroke-width="4"/>
  <line x1="325.7" y1="92.2" x2="390" y2="92.2" stroke="#94a3b8" stroke-width="3" stroke-dasharray="5 4"/>

  <text x="400" y="204" class="sm" fill="#b45309">半径 r</text>
  <text x="296" y="52" class="sm" fill="#047857">弧の長さ r</text>
  <text x="258" y="196" class="sm" fill="#334155">1 rad</text>
  <text x="288" y="140" class="sm" fill="#64748b">約 57.3°</text>

  <text x="568" y="88" class="heading">弧度法</text>
  <text x="568" y="128" class="formula">180° ＝ π rad　90° ＝ π/2</text>
  <text x="568" y="160" class="formula">弧長 l ＝ rθ（θ は rad）</text>
  <text x="568" y="192" class="formula">扇形 S ＝ 1/2 r²θ ＝ 1/2 rl</text>
  <line x1="568" y1="212" x2="824" y2="212" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="242" class="note">1 rad ≈ 57.3°（半径＝弧長のとき）</text>
  <text x="568" y="274" class="formula">診断：90° → π/2 rad</text>
  <text x="568" y="302" class="note">三角関数の極限・微分は</text>
  <text x="568" y="328" class="note">この rad で式が素直になる</text>
</svg>
