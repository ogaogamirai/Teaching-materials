<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="310" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">複素数平面と「i を掛けると90°回転」の図解</text>

  <!-- Left: Complex Plane Diagram -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="300" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#334155" stroke-width="1.5"/>

    <!-- Axes -->
    <line x1="30" y1="200" x2="270" y2="200" stroke="#64748b" stroke-width="1.5"/>
    <line x1="150" y1="30" x2="150" y2="370" stroke="#64748b" stroke-width="1.5"/>

    <text x="275" y="205" fill="#cbd5e1" font-size="13" font-weight="bold">実軸 (Re)</text>
    <text x="150" y="20" fill="#cbd5e1" font-size="13" font-weight="bold" text-anchor="middle">虚軸 (Im: i)</text>

    <!-- Unit Circle for Rotation -->
    <circle cx="150" cy="200" r="110" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" fill="rgba(56, 189, 248, 0.03)"/>

    <!-- Rotation Arrows: 1 -> i -> -1 -> -i -> 1 -->
    <path d="M 260 200 A 110 110 0 0 0 150 90" fill="none" stroke="#fbbf24" stroke-width="3.5" marker-end="url(#arrow)"/>
    
    <!-- Points -->
    <!-- Point 1 -->
    <circle cx="260" cy="200" r="6" fill="#06b6d4"/>
    <text x="270" y="220" fill="#06b6d4" font-size="15" font-weight="bold">1</text>

    <!-- Point i -->
    <circle cx="150" cy="90" r="6" fill="#fbbf24"/>
    <text x="165" y="85" fill="#fbbf24" font-size="15" font-weight="bold">i (90°回転)</text>

    <!-- Point -1 -->
    <circle cx="40" cy="200" r="6" fill="#f43f5e"/>
    <text x="15" y="220" fill="#f43f5e" font-size="15" font-weight="bold">-1 (180°)</text>

    <!-- Point -i -->
    <circle cx="150" cy="310" r="6" fill="#a7f3d0"/>
    <text x="165" y="325" fill="#a7f3d0" font-size="15" font-weight="bold">-i (270°)</text>

    <!-- General Complex Number z = a + bi -->
    <line x1="150" y1="200" x2="225" y2="125" stroke="#f8fafc" stroke-width="2.5"/>
    <circle cx="225" cy="125" r="5" fill="#f8fafc"/>
    <text x="235" y="120" fill="#f8fafc" font-size="14" font-weight="bold">z = a + bi</text>
  </g>

  <!-- Right: Formulas & ManabiTimes Points -->
  <g transform="translate(335, 50)">
    <rect x="0" y="0" width="265" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="132" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">複素数と回転の仕組み</text>

    <!-- i^2 = -1 Box -->
    <rect x="15" y="50" width="235" height="90" fill="#0f172a" rx="8" stroke="#38bdf8" stroke-width="1"/>
    <text x="25" y="75" fill="#38bdf8" font-size="14" font-weight="bold">① 虚数 i の定義</text>
    <text x="25" y="105" fill="#ffffff" font-size="15" font-weight="bold">i² ＝ −1  （i ＝ √−1）</text>
    <text x="25" y="125" fill="#cbd5e1" font-size="12">2回掛けると向きが反対（−1）になる！</text>

    <!-- Polar Form Box -->
    <rect x="15" y="155" width="235" height="110" fill="#0f172a" rx="8" stroke="#fb7185" stroke-width="1"/>
    <text x="25" y="180" fill="#fb7185" font-size="14" font-weight="bold">② 極形式（長さ r と 角度 θ）</text>
    <text x="25" y="210" fill="#a7f3d0" font-size="13" font-weight="bold">z ＝ r (cosθ ＋ i sinθ)</text>
    <text x="25" y="240" fill="#cbd5e1" font-size="12">長さ r ＝ √(a² ＋ b²)、角度 θ（偏角）</text>

    <!-- Multiplication Rule Box -->
    <rect x="15" y="280" width="235" height="95" fill="#0f172a" rx="8" stroke="#a7f3d0" stroke-width="1"/>
    <text x="25" y="305" fill="#a7f3d0" font-size="14" font-weight="bold">③ 複素数の掛け算の法則</text>
    <text x="25" y="335" fill="#fbbf24" font-size="13" font-weight="bold">「長さは掛け算、角度は足し算」</text>
    <text x="25" y="358" fill="#cbd5e1" font-size="12">➔ これがオイラーの公式 e^{iθ} の土台！</text>
  </g>
</svg>
