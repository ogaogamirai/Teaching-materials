<!-- layout v4 2026-08-30: widen panel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc">
  <title id="title">原点中心の 90° 回転：(1,0) → (0,1)</title>
  <desc id="desc">点(1,0)を原点中心に反時計回りに90°回すと(0,1)に来ることを、円と弧の矢印で示す図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 20px; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formp { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="860" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="292" height="336" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="100" y1="240" x2="430" y2="240" stroke="#94a3b8" stroke-width="4"/>
  <line x1="260" y1="60" x2="260" y2="390" stroke="#94a3b8" stroke-width="4"/>

  <circle cx="260" cy="240" r="120" fill="none" stroke="#64748b" stroke-width="3"/>

  <path d="M 380 240 A 120 120 0 0 0 260 120" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <polygon points="253,132 267,132 260,116" fill="#f59e0b"/>

  <line x1="260" y1="240" x2="380" y2="240" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="260" y1="240" x2="260" y2="120" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>

  <circle cx="380" cy="240" r="7" fill="#0ea5e9"/>
  <circle cx="260" cy="120" r="7" fill="#ef4444"/>

  <text x="392" y="234" class="label" fill="#0369a1">(1, 0)</text>
  <text x="268" y="108" class="label" fill="#b45309">(0, 1)</text>
  <text x="246" y="262" class="sm">O（中心）</text>
  <text x="300" y="174" class="sm" fill="#f59e0b">90° 反時計回り</text>

  <text x="568" y="88" class="heading">回転移動</text>
  <text x="568" y="128" class="formp">中心 O・反時計回り正・距離は保存</text>
  <text x="568" y="154" class="formp">180° → (−1,0)・270° → (0,−1)</text>
  <line x1="568" y1="172" x2="824" y2="172" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="202" class="note">点対称 ＝ 180° 回転</text>
  <text x="568" y="228" class="note">線対称 ＝ 折り返し（鏡）</text>
  <text x="568" y="262" class="formp">診断：(1,0) 90°CCW → (0,1)</text>
  <text x="568" y="292" class="note">円周上の移動＝単位円の種</text>
  <text x="568" y="318" class="note">一般角（負の角・1 周超）へ</text>
</svg>
