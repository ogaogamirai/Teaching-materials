<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title desc">
  <title id="title">三平方の定理の導出：垂線と相似</title>
  <desc id="desc">直角三角形ABCに頂点Cから斜辺ABへ垂線CHを下ろし、2つの相似からa²+b²=c²を導く図</desc>
  <style>
    text {
      font-family: "BIZ UDPGothic", "Yu Gothic UI", "Noto Sans JP", "Meiryo", sans-serif;
      font-weight: 500;
    }
    .label { font-size: 21px; fill: #334155; }
    .sideL { font-size: 20px; fill: #334155; }
    .sm { font-size: 16px; fill: #475569; }
    .heading { font-size: 22px; font-weight: 700; fill: #334155; }
    .formp { font-size: 15px; fill: #475569; }
    .note { font-size: 15px; fill: #475569; }
  </style>

  <rect width="820" height="400" rx="18" fill="#f8fafc"/>
  <rect x="548" y="44" width="252" height="312" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <line x1="110" y1="310" x2="410" y2="310" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <line x1="110" y1="310" x2="410" y2="110" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <line x1="410" y1="310" x2="410" y2="110" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <line x1="410" y1="310" x2="335" y2="155" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 5"/>

  <path d="M 396 310 L 396 296 L 410 296" fill="none" stroke="#334155" stroke-width="3"/>

  <circle cx="110" cy="310" r="6" fill="#0ea5e9"/>
  <circle cx="410" cy="110" r="6" fill="#eab308"/>
  <circle cx="410" cy="310" r="6" fill="#ef4444"/>
  <circle cx="335" cy="155" r="6" fill="#64748b"/>

  <text x="96" y="332" class="label">A</text>
  <text x="418" y="98" class="label">B</text>
  <text x="418" y="332" class="label">C</text>
  <text x="312" y="140" class="sm" fill="#64748b">H</text>
  <text x="150" y="338" class="sideL" fill="#b45309">a</text>
  <text x="252" y="198" class="sideL" fill="#0369a1">c</text>
  <text x="418" y="218" class="sideL" fill="#f59e0b" fill-opacity="1.0">b</text>
  <text x="340" y="248" class="sm" fill="#ef4444">CH（垂線）</text>

  <text x="568" y="88" class="heading">三平方の定理</text>
  <text x="568" y="126" class="formp">a² ＋ b² ＝ c²（c は斜辺）</text>
  <line x1="568" y1="144" x2="772" y2="144" stroke="#e2e8f0" stroke-width="2"/>
  <text x="568" y="174" class="note">垂線 CH で相似 2 組を作る</text>
  <text x="568" y="200" class="note">△ACH∽△ABC ・ △BCH∽△ABC</text>
  <text x="568" y="232" class="formp">b² ＝ c·AH、a² ＝ c·BH</text>
  <text x="568" y="254" class="formp">→ 足し合わせて c²</text>
  <text x="568" y="288" class="formp">診断：1-1-? → √2</text>
  <text x="568" y="318" class="note">3-4-5・5-12-13 が生まれる</text>
</svg>
