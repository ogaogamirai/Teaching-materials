<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; border-radius: 12px;">
  <!-- Title -->
  <text x="320" y="35" fill="#38bdf8" font-size="20" font-weight="bold" text-anchor="middle">マクローリン展開によるオイラーの公式完全証明とフーリエ変換への接続</text>

  <!-- Left: Maclaurin Expansion Proof -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="290" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="145" y="30" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">① マクローリン展開による証明</text>

    <!-- e^{iθ} Expansion Box -->
    <rect x="12" y="50" width="266" height="110" fill="#0f172a" rx="6" stroke="#38bdf8" stroke-width="1"/>
    <text x="20" y="73" fill="#38bdf8" font-size="13" font-weight="bold">e^{iθ} に iθ を代入して展開:</text>
    <text x="20" y="98" fill="#ffffff" font-size="12">1 ＋ iθ − θ²/2! − iθ³/3! ＋ θ⁴/4! ＋ iθ⁵/5! ...</text>
    <text x="20" y="125" fill="#fbbf24" font-size="11">実部と虚部 (i) にグループ分け！</text>
    <text x="20" y="145" fill="#a7f3d0" font-size="11">i²＝−1, i³＝−i, i⁴＝1 の周期法則</text>

    <!-- Grouped Terms -->
    <rect x="12" y="170" width="266" height="205" fill="#0f172a" rx="6" stroke="#fbbf24" stroke-width="1"/>
    <text x="20" y="195" fill="#06b6d4" font-size="13" font-weight="bold">実部 ＝ (1 − θ²/2! ＋ θ⁴/4! − ...) ＝ cos θ</text>
    <text x="20" y="240" fill="#fb7185" font-size="13" font-weight="bold">虚部 ＝ i (θ − θ³/3! ＋ θ⁵/5! − ...) ＝ i sin θ</text>

    <text x="20" y="290" fill="#a7f3d0" font-size="14" font-weight="bold">➔ e^{iθ} ＝ cos θ ＋ i sin θ</text>
    <text x="20" y="315" fill="#cbd5e1" font-size="12">100% 完璧な数学的証明が完成！</text>
    <text x="20" y="340" fill="#fbbf24" font-size="12" font-weight="bold">θ ＝ π で e^{iπ} ＋ 1 ＝ 0 （オイラーの等式）</text>
  </g>

  <!-- Right: Connection to Fourier Transform -->
  <g transform="translate(330, 50)">
    <rect x="0" y="0" width="290" height="390" fill="rgba(30, 41, 59, 0.7)" rx="10" stroke="#0284c7" stroke-width="1.5"/>
    <text x="145" y="30" fill="#22d3ee" font-size="16" font-weight="bold" text-anchor="middle">② フーリエ変換 (FT) へのつながり</text>

    <!-- FT Formula Box -->
    <rect x="12" y="50" width="266" height="110" fill="#0f172a" rx="6" stroke="#22d3ee" stroke-width="1"/>
    <text x="20" y="73" fill="#22d3ee" font-size="13" font-weight="bold">フーリエ変換の基本公式:</text>
    <text x="20" y="103" fill="#ffffff" font-size="14" font-weight="bold">F(ω) = ∫_{-∞}^{∞} f(t) e^{-iωt} dt</text>
    <text x="20" y="130" fill="#a7f3d0" font-size="11">逆回転波 e^{-iωt} ＝ cos(ωt) − i sin(ωt)</text>

    <!-- Meaning of e^{-iωt} -->
    <rect x="12" y="170" width="266" height="205" fill="#0f172a" rx="6" stroke="#334155" stroke-width="1"/>
    <text x="20" y="195" fill="#fbbf24" font-size="13" font-weight="bold">【なぜ e^{-iωt} を掛けるのか？】</text>
    <text x="20" y="220" fill="#ffffff" font-size="12">・波 f(t) に『周波数 ω の逆回転波』を</text>
    <text x="20" y="240" fill="#ffffff" font-size="12">　掛け合わせて 1 周期積分（内積）！</text>
    <text x="20" y="270" fill="#a7f3d0" font-size="12" font-weight="bold">・直交性により、ピッタリ同じ周波数</text>
    <text x="20" y="290" fill="#a7f3d0" font-size="12" font-weight="bold">　ω の波だけが残って抽出される！</text>
    <text x="20" y="325" fill="#38bdf8" font-size="12" font-weight="bold">➔ 音の分解や画像処理の基本原理！</text>
  </g>
</svg>
